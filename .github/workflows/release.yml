name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Tag must match package.json version");'
      - run: npm test
      - run: npm run build
      - run: npm run package:release
      - name: Publish source, site, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" releases/"$RELEASE_TAG"/* --verify-tag --notes-file "docs/releases/$RELEASE_TAG.md" --title "Lockray $RELEASE_TAG"
